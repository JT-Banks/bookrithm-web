openapi: 3.0.3

info:
  title: Bookrithm API
  description: Backend API for the Bookrithm book tracking and discovery platform.
  version: 1.0.0

servers:
  - url: http://localhost:8080/bookrithm/v1
    description: Local development

tags:
  - name: books
    description: Book search and retrieval
  - name: categories
    description: Genre and category taxonomy
  - name: users
    description: User profile management
  - name: shelves
    description: Reading shelves and book state
  - name: reviews
    description: Multi-dimensional book reviews
  - name: suggestions
    description: User-submitted category and content suggestions
  - name: admin
    description: Admin-only moderation operations

security:
  - bearerAuth: []

paths:

  /books:
    get:
      tags: [books]
      summary: Search and list books
      operationId: searchBooks
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: q
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 200
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: maturity
          in: query
          schema:
            $ref: '#/components/schemas/MaturityRating'
      responses:
        '200':
          description: Paginated list of books
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /books/{id}:
    get:
      tags: [books]
      summary: Get a book by ID
      operationId: getBookById
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /books/{id}/categories:
    get:
      tags: [books]
      summary: Get weighted category breakdown for a book
      operationId: getBookCategories
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Weighted category list for the book
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryWeightResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /books/{bookId}/reviews:
    get:
      tags: [reviews]
      summary: List reviews for a book
      operationId: getBookReviews
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/BookIdPathParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated list of reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [reviews]
      summary: Create a review for a book
      operationId: createReview
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/BookIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /books/{bookId}/reviews/{reviewId}:
    put:
      tags: [reviews]
      summary: Update a review
      operationId: updateReview
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/BookIdPathParam'
        - $ref: '#/components/parameters/ReviewIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '200':
          description: Review updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [reviews]
      summary: Delete a review
      operationId: deleteReview
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/BookIdPathParam'
        - $ref: '#/components/parameters/ReviewIdPathParam'
      responses:
        '204':
          description: Review deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /categories:
    get:
      tags: [categories]
      summary: List categories
      operationId: listCategories
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: parentId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated list of categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /categories/{id}:
    get:
      tags: [categories]
      summary: Get a category by ID
      operationId: getCategoryById
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Category found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/me:
    get:
      tags: [users]
      summary: Get the authenticated user profile
      operationId: getCurrentUser
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [users]
      summary: Register profile on first login
      operationId: registerCurrentUser
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '201':
          description: User profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [users]
      summary: Update the authenticated user profile
      operationId: updateCurrentUser
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/me/shelves:
    get:
      tags: [shelves]
      summary: List the authenticated user shelves
      operationId: getCurrentUserShelves
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: List of shelves
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShelfResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/me/shelves/{shelfId}/books:
    get:
      tags: [shelves]
      summary: List books on a shelf
      operationId: getShelfBooks
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/ShelfIdPathParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated list of books on the shelf
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBookStatePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/me/books/{bookId}/state:
    put:
      tags: [shelves]
      summary: Add or move a book to a shelf
      operationId: setBookState
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/BookIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBookStateRequest'
      responses:
        '200':
          description: Book state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBookStateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [shelves]
      summary: Remove a book from all shelves
      operationId: removeBookState
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/BookIdPathParam'
      responses:
        '204':
          description: Book removed from shelf
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /suggestions:
    get:
      tags: [suggestions]
      summary: List the authenticated user's suggestions
      operationId: getUserSuggestions
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated list of the user's suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [suggestions]
      summary: Submit a suggestion
      operationId: submitSuggestion
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionRequest'
      responses:
        '202':
          description: Suggestion accepted and queued for AI review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/suggestions:
    get:
      tags: [admin]
      summary: List suggestions pending moderation
      operationId: adminListSuggestions
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SuggestionStatus'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/SuggestionType'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated list of suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/suggestions/{id}/decision:
    put:
      tags: [admin]
      summary: Approve or reject a suggestion
      operationId: adminDecideSuggestion
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionDecisionRequest'
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    BookIdPathParam:
      name: bookId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ReviewIdPathParam:
      name: reviewId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ShelfIdPathParam:
      name: shelfId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

    SizeParam:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid

  headers:
    XRequestIdResponse:
      description: Echoed request correlation ID.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request body or query parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user lacks the required role or permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    ErrorResponse:
      type: object
      required: [status, code, message, timestamp]
      properties:
        status:
          type: integer
          example: 404
        code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          example: Book with id 'abc' was not found.
        path:
          type: string
          example: /bookrithm/v1/books/abc
        timestamp:
          type: string
          format: date-time

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    BookSource:
      type: string
      enum: [GOOGLE_BOOKS]

    MaturityRating:
      type: string
      enum: [UNKNOWN, EVERYONE, TEEN, MATURE]

    SuggestionStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    SuggestionType:
      type: string
      enum: [CATEGORY, TROPE, CONTENT_WARNING]

    TrustLevel:
      type: string
      enum: [NORMAL, TRUSTED, MODERATOR, ADMIN]

    ReaderStatus:
      type: string
      enum: [READING, COZY_READING, BETWEEN_BOOKS, SEARCHING, REREADING, ON_HIATUS, BUSY]

    CategoryResponse:
      type: object
      required: [id, name, maturity]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true
        maturity:
          $ref: '#/components/schemas/MaturityRating'

    CategoryWeightResponse:
      type: object
      required: [category, weight, computedAt]
      properties:
        category:
          $ref: '#/components/schemas/CategoryResponse'
        weight:
          type: integer
          minimum: 0
          maximum: 100
        computedAt:
          type: string
          format: date-time

    CategoryPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CategoryResponse'
        page:
          $ref: '#/components/schemas/PageMeta'

    BookResponse:
      type: object
      required: [id, source, title, author, isFanfiction, maturity]
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/BookSource'
        title:
          type: string
        author:
          type: string
        description:
          type: string
          nullable: true
        coverUrl:
          type: string
          nullable: true
        isFanfiction:
          type: boolean
        maturity:
          $ref: '#/components/schemas/MaturityRating'
        isbn10:
          type: string
          nullable: true
        isbn13:
          type: string
          nullable: true

    BookPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BookResponse'
        page:
          $ref: '#/components/schemas/PageMeta'

    UserResponse:
      type: object
      required: [id, username, displayName, isPrivate, trustLevel, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        readerStatus:
          $ref: '#/components/schemas/ReaderStatus'
        isPrivate:
          type: boolean
        firstName:
          type: string
          nullable: true
          description: Only returned when isPrivate is false or the requester is the owner.
        lastName:
          type: string
          nullable: true
          description: Only returned when isPrivate is false or the requester is the owner.
        location:
          type: string
          nullable: true
          description: Only returned when isPrivate is false or the requester is the owner.
        websiteUrl:
          type: string
          nullable: true
        goodreadsUrl:
          type: string
          nullable: true
        storyGraphUrl:
          type: string
          nullable: true
        instagramUrl:
          type: string
          nullable: true
        twitterUrl:
          type: string
          nullable: true
        allowAnonymousPublicReviews:
          type: boolean
        allowPublicCredibilityStats:
          type: boolean
        trustLevel:
          $ref: '#/components/schemas/TrustLevel'
        createdAt:
          type: string
          format: date-time

    RegisterUserRequest:
      type: object
      required: [username, displayName, email]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
          pattern: '^[a-zA-Z0-9_]+$'
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254

    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
          pattern: '^[a-zA-Z0-9_]+$'
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        firstName:
          type: string
          maxLength: 80
          nullable: true
        lastName:
          type: string
          maxLength: 80
          nullable: true
        location:
          type: string
          maxLength: 100
          nullable: true
        bio:
          type: string
          maxLength: 500
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        websiteUrl:
          type: string
          nullable: true
        goodreadsUrl:
          type: string
          nullable: true
        storyGraphUrl:
          type: string
          nullable: true
        instagramUrl:
          type: string
          nullable: true
        twitterUrl:
          type: string
          nullable: true
        readerStatus:
          $ref: '#/components/schemas/ReaderStatus'
        isPrivate:
          type: boolean
        allowAnonymousPublicReviews:
          type: boolean
        allowPublicCredibilityStats:
          type: boolean

    ShelfResponse:
      type: object
      required: [id, name, isSystem, bookCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        isSystem:
          type: boolean
        maxItems:
          type: integer
          nullable: true
        bookCount:
          type: integer

    SetBookStateRequest:
      type: object
      required: [shelfId]
      properties:
        shelfId:
          type: string
          format: uuid

    UserBookStateResponse:
      type: object
      required: [bookId, shelfId, shelfName, position, addedAt]
      properties:
        bookId:
          type: string
          format: uuid
        bookTitle:
          type: string
          nullable: true
        shelfId:
          type: string
          format: uuid
        shelfName:
          type: string
        position:
          type: integer
        addedAt:
          type: string
          format: date-time

    UserBookStatePage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserBookStateResponse'
        page:
          $ref: '#/components/schemas/PageMeta'

    ReviewRequest:
      type: object
      properties:
        overall:
          type: integer
          minimum: 0
          maximum: 10
        grammar:
          type: integer
          minimum: 0
          maximum: 10
        storytelling:
          type: integer
          minimum: 0
          maximum: 10
        worldbuilding:
          type: integer
          minimum: 0
          maximum: 10
        characters:
          type: integer
          minimum: 0
          maximum: 10
        pacing:
          type: integer
          minimum: 0
          maximum: 10
        reviewText:
          type: string

    ReviewResponse:
      type: object
      required: [id, userId, bookId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        bookId:
          type: string
          format: uuid
        overall:
          type: integer
          nullable: true
          minimum: 0
          maximum: 10
        grammar:
          type: integer
          nullable: true
          minimum: 0
          maximum: 10
        storytelling:
          type: integer
          nullable: true
          minimum: 0
          maximum: 10
        worldbuilding:
          type: integer
          nullable: true
          minimum: 0
          maximum: 10
        characters:
          type: integer
          nullable: true
          minimum: 0
          maximum: 10
        pacing:
          type: integer
